    services:
      - name:  "JBoss"
        class: "system"
        check: { type: "metric", query: "jboss_status", name_label: "name", members: [] }
      - name:  "Oracle Listener"
        class: "system"
        check: { type: "metric", query: "max by (service) (oracle_listener_instance_status)", name_label: "service", members: [] }
