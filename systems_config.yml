# =============================================================================
#  systems_config.yml  -  single source of truth for the System Admin Report.
#
#  Add a system by adding a block under `systems:`.  Every system has the SAME
#  four keys (use [] / {} when empty) so the data stays uniform and parseable,
#  plus an OPTIONAL 5th `backups` key (omit it, or {}, for no backup monitoring):
#
#    hosts:     list of { role: str, label: str, instance: "ip:port", os: "linux"|"windows" }
#               -> each host is a row in the Memory (RAM %), CPU (busy %) and Disk tables;
#                  values are pulled LIVE from Prometheus by `instance`.
#                  role names the host's job: database | reverse-proxy | app |
#                  app-db | web | web-db | frontend1 | backend | dr | bkp | ...
#    services:  list of { name: str, class: "system"|"offered", check: {..} }
#               -> each is a row in the Services table with a status chip.
#                  class:  system  = infrastructure that keeps the platform running
#                          offered = business endpoints delivered to users
#                  check.type (uniform fields per type, optional ones = null):
#                    windows_service { service, instance }
#                    systemd         { unit, instance, unit_type }    # unit_type may be null
#                    host_up         { instance }
#                    http_probe      { target }                       # IP or URL (blackbox)
#                    metric          { query, name_label, members }   # raw PromQL escape hatch;
#                                     name_label spreads one row per series; members lists the
#                                     expected series (or [] to discover them at runtime).
#    links:     list of URL strings -> each a WEB LINKS row (UP/DOWN + SSL cert days + TLS).
#    readings:  map of headline numbers for the summary (cob / swift), or {} if none.
#    backups:   OPTIONAL. { instance: "ip:port", tracks: "glob" } for a system whose
#               exporter publishes the backup_file metric. When present, a Backups
#               panel is shown and NO fresh backup (or the metric absent) = CRITICAL.
#               Omit the key (or use {}) for systems without backup monitoring.
#               max_age_days: OPTIONAL, default 1 (today or yesterday). Set this for a host
#               that backs up on a slower cycle (e.g. every 3rd day), otherwise the days
#               between its runs are misreported as NO BACKUP even though the policy is
#               being met. Mirrors BACKUP_MAX_AGE_DAYS in send_report/generate_report.py
#               and -MaxAgeDays in the matching backup_monitor\check_backup_*.ps1 - keep
#               all three in step for a given host.
#               e.g. backups: { instance: "10.0.206.5:9182", tracks: "BSAV50_FULL_*.bak", max_age_days: 3 }
#
# =============================================================================
#  REPORT OVERVIEW  --  "NEEDS ATTENTION" IS SPLIT BY URGENCY (two bands)
# -----------------------------------------------------------------------------
#  The xlsx report and the e-mail summary group the live health signals into
#  TWO bands, by how soon a human must act. Same signals, different urgency:
#
#    NEEDS IMMEDIATE ATTENTION  --  something is FAILING NOW (act immediately):
#        * MISSING BACKUPS  -- a host that should have a fresh backup has none
#        * UNREACHABLE      -- Prometheus `up == 0` (host down / exporter / network)
#        * SERVICES DOWN    -- a monitored service check reports 0
#        * DISK NEAR-FULL   -- any disk at/over the RED level (imminent outage)
#        * EXPIRED CERTS    -- an SSL certificate has already lapsed (site effectively down)
#
#    NEEDS ATTENTION  --  DEGRADING, not yet failing (watch / plan):
#        * HIGH CPU USAGE    -- cpu busy at/over the AMBER level
#        * HIGH RAM USAGE    -- memory at/over the AMBER level
#        * HIGH DISK USAGE   -- a disk over AMBER but still under RED
#        * WEB ENCRYPTION    -- endpoints still on plain HTTP (green only when http == 0,
#                               red when http endpoints OUTNUMBER https, else amber)
#        * UNTRACKED BACKUPS -- a system with NO backup monitoring configured at all
#
#  DISK is the only signal that MOVES between bands, by severity band, not by
#  identity: a disk >= RED% is promoted to "immediate" (a full disk takes the
#  service down); an elevated-but-not-red disk stays in "needs attention". RAM
#  never promotes (the OS reclaims/swaps; high RAM is pressure, not an outage).
#  Each host lands in exactly ONE disk band (its worst disk decides), so the two
#  disk tiles never double-count a server.
#
#  Thresholds (percent USED) live in send_report/config.ini, defaults:
#        chip_amber        = 75   # per-cell AMBER  (>= amber -> warning colour)
#        chip_red          = 90   # per-cell RED    (>= red   -> critical; disk => "near-full")
#        overview_threshold = 85  # the "elevated / high disk|ram" counting line
#  SSL certs (from `links`): < 7 days => immediate, < 24 days => needs attention.
#
# =============================================================================
#  HOW EACH SIGNAL IS FETCHED FROM PROMETHEUS  (instant queries; used verbatim
#  by send_report/generate_report.py and by the ASP.NET ingestion API)
# -----------------------------------------------------------------------------
#  disk (per host `instance`, per mount/volume):
#    linux   used% : 100*(1 - node_filesystem_avail_bytes{FS}/node_filesystem_size_bytes{FS})
#            free  : node_filesystem_avail_bytes{FS}/1024/1024/1024        (GB)
#            size  : node_filesystem_size_bytes{FS}/1024/1024/1024         (GB)
#            FS    = fstype=~"ext.*|xfs|btrfs", mountpoint excludes pod/container/snap paths
#    windows used% : 100*(1 - windows_logical_disk_free_bytes{VOL}/windows_logical_disk_size_bytes{VOL})
#            free/size as above; VOL = volume!~"HarddiskVolume.+";  key = `volume` label
#  memory (per host, used%):
#    linux   : 100*(1 - node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes)
#    windows : 100*(1 - windows_memory_physical_free_bytes/windows_memory_physical_total_bytes)
#  cpu (per host, busy% = 100 - idle, 5-min avg):
#    linux   : 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
#    windows : 100 - (avg by (instance) (rate(windows_cpu_time_total{mode="idle"}[5m])) * 100)
#  reachability (per host):  max by (instance) (up)          # 1 reachable / 0 unreachable
#  services (per check spec): run check.query / the type's PromQL; 1 = up, 0 = down.
#            check.name_label spreads one series per member; `members` lists the
#            expected series (or [] to discover at runtime).
#  links (per URL, blackbox exporter):
#            up        : probe_success                        (>= 1)
#            http code : probe_http_status_code
#            ssl?      : probe_http_ssl                       (>= 1)
#            cert_days : (probe_ssl_earliest_cert_expiry - time())/86400
#            duration  : probe_duration_seconds
#            tls       : version label of probe_tls_version_info
#  readings (headline scalars): cob -> cob_time ; swift -> swift_transactions_total
#  backups (only for systems with a `backups:` block, textfile collector):
#            files : backup_file          (value = file mtime unix secs; labels file, day)
#            count : backup_file_count
#            ok    : backup_check_success                     (>= 1)
#            ts    : backup_check_timestamp_seconds
#            "fresh" = a file whose mtime >= yesterday-midnight (local). A host with
#            no fresh file, or whose check is absent/failed, counts as MISSING.
#
# =============================================================================
#  DATABASE PERSISTENCE MAP  (custom MSSQL; ASP.NET API ingests on a schedule)
# -----------------------------------------------------------------------------
#  This file is the SOURCE OF TRUTH the API syncs into config tables, then it
#  polls Prometheus and writes one set of *Sample rows per PollRun.
#
#    yaml key / signal        MSSQL table(s)                 mandatory?
#    ----------------------   ----------------------------   ----------------------
#    system block             Systems                        yes
#    hosts[]                  Hosts                          yes (>= 1 per system)
#    services[]               ServiceChecks (+ServiceMembers) optional ([] allowed)
#    links[]                  LinkChecks                     optional ([] allowed)
#    readings{}               ReadingConfigs                 optional ({} allowed)
#    backups{}                BackupConfigs                  OPTIONAL (omit / {})
#    ----------------------   ----------------------------   ----------------------
#    disk used%/free/size     DiskSamples                    per host, per poll
#    memory used%             MemorySamples                  per host, per poll
#    cpu busy%                CpuSamples                     per host, per poll
#    up                       HostReachabilitySamples        per host, per poll
#    service check state      ServiceStatusSamples           per member, per poll
#    link probe               LinkProbeSamples               only if links present
#    cob / swift              ReadingSamples                 only if readings present
#    backup files / check     BackupFileSamples,             ONLY if backups present
#                             BackupCheckSamples             (systems w/o backups: none)
#    derived urgency items    AttentionItems (Immediate|Watch) per poll
#                             Category: MissingBackup|Unreachable|ServiceDown|DiskNearFull|
#                             HighDisk|HighRam|HighCpu|SslExpiry|LinkDown|UntrackedBackup.
#                             WEB ENCRYPTION (https vs http) is derived at read time from the
#                             scheme of LinkChecks.Url — it needs no sample/attention rows.
#
#  MANDATORY vs OPTIONAL: a system with no `backups:` writes NOTHING to the
#  Backup* tables (they stay empty for it, and its Hosts carry no backup rows) --
#  exactly as the report shows no Backups panel. The same holds for services /
#  links / readings: an empty list simply yields no config rows and no samples.
# =============================================================================

