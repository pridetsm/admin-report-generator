; ============================================================================
;  grafana.custom.sample.ini — SAMPLE for the webapp's Grafana config screen
;
;  Not custom.ini itself — this is the SHAPE the "Grafana" Configuration screen
;  edits as raw text. The real file lives at
;    C:\Program Files\GrafanaLabs\grafana\conf\custom.ini
;  never defaults.ini (Grafana's own ~105KB shipped reference of every setting,
;  overwritten on every upgrade — custom.ini is the small overlay this install
;  actually uses, and the only file meant to be hand-edited).
;
;  The screen masks the `password` line under [smtp] with a placeholder in every
;  browser view and DB revision — it never round-trips to the browser or sits in
;  the database in the clear. See webapp/reports/grafana_admin.py.
; ============================================================================

#################################### Server ####################################
[server]
protocol = https
cert_file = C:\metrics\prometheus\server.crt
cert_key = C:\metrics\prometheus\server.key
root_url = https://GRAFANA_HOST:3000

#################################### Security ####################################
[security]
allow_embedding = true

#################################### SMTP / Emailing ####################################
[smtp]
enabled = true
host = smtp.example.org:587
user = noreply@example.org
; Real value only ever lives encrypted at rest (see crypto.py) and in the live file —
; the Configuration screen always shows {{KEEP-EXISTING-PASSWORD}} here instead.
password = CHANGE_ME
skip_verify = false
from_address = noreply@example.org
from_name = Grafana
ehlo_identity = example.org
starttls_policy = Always

#################################### Alerts / Notifications ####################################
[alerting]
execute_alerts = true
