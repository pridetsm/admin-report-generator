{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Report Builder</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <img src="{% static 'img/logo.png' %}" alt="Reserve Bank of Zimbabwe" class="login-logo">
    <h1>Sign in</h1>
    <p class="sub">Admin access to generate system reports.</p>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="errornote">{{ form.non_field_errors|striptags }}</div>{% endif %}
      <label for="{{ form.username.id_for_label }}">Username</label>
      <input type="text" name="username" id="{{ form.username.id_for_label }}" autocomplete="username" autofocus required>
      <label for="{{ form.password.id_for_label }}">Password</label>
      <input type="password" name="password" id="{{ form.password.id_for_label }}" autocomplete="current-password" required
             style="width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel-2);color:var(--ink);font:inherit">
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
