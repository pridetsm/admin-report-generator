; ============================================================================
;  Admin Report Generator — engine configuration SAMPLE
;  Copy to  send_report/config.ini  and fill in your real values.
;  (The real, filled-in file is delivered out-of-band in deploy/config.ini and
;   must NOT be committed — it contains the SMTP password and internal URLs.)
;  Both generate_report.py and mail_report.py read their settings from here.
; ============================================================================

[prometheus]
; The Prometheus server the report/dashboard queries for live metrics.
url = http://PROMETHEUS_HOST:9090
; System -> hosts topology is read from this file (grouped by each target's `system` label).
; Path is resolved relative to send_report/ , so ../prometheus.yml = the repo-root prometheus.yml.
yml = ../prometheus.yml

[grafana]
; Full dashboard deep-link used for the in-report / e-mail / dashboard "Open Grafana" buttons.
url = http://GRAFANA_HOST:3000/d/DASHBOARD_UID/system-admin-dashboard?orgId=1&refresh=30s

[report]
output = System Admin Report.xlsx
overview_threshold = 85
chip_amber = 75
chip_red = 90

[logo]
; placement is in EMU (1 px = 9525 EMU); these reproduce the approved report layout
path = logo.png
from_col = 1
from_coloff = 448946
from_row = 2
from_rowoff = 95250
cx = 503554
cy = 990599

[smtp]
; Outbound mail for the "Generate & e-mail" feature. Office 365 example shown.
host = smtp.office365.com
port = 587
user = noreply@example.org
; SECRET — keep this only in the real deploy/config.ini, never in the sample/repo.
password = CHANGE_ME
from_address = noreply@example.org
from_name = System Admin Dashboard
starttls = true
skip_verify = false
ehlo = example.org

[recipients]
; Default mailing list — comma-separated. Used to pre-tick recipients in the e-mail dialog.
to = ops@example.org

[auth]
; Org sign-in: the webapp POSTs {"username": ..., "password": ...} as JSON to this endpoint.
;   valid login  -> HTTP 200 + {username, firstName, lastName, email, enabled, ...}
;   bad creds    -> HTTP 403
; The local Django 'admin' account still works as a fallback if the endpoint is unreachable.
enabled = true
url = https://AUTH_HOST:7272/api/auth
success_field = username
email_field = email
first_name_field = firstName
last_name_field = lastName
department_field = departmentName
dn_field = distinguishedName
verify_tls = true
timeout = 8

[keycloak]
; Keycloak is the ROLE store only — sign-in stays with [auth] above.
; While enabled=false, roles are managed locally (Administrator console / Django admin).
; Set enabled=true once these are filled AND KEYCLOAK_CLIENT_SECRET is set in the environment.
enabled = false
base_url = https://KEYCLOAK_HOST
realm = your-realm
client_id = report-builder
; client secret comes from env KEYCLOAK_CLIENT_SECRET (do NOT put it here)
verify_tls = true
timeout = 8
